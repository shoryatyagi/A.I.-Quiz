AWSTemplateFormatVersion: '2010-09-09'
Description: QuizMaster scalable platform - ECS Fargate services, ALB, Redis, ECR and scoped GitHub Actions OIDC role.

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: Optional hostname covered by the ACM certificate. Leave blank for the ALB DNS URL.
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN in this region. Leave blank for an HTTP demo endpoint.
  FrontendRepository:
    Type: String
    Default: shoryatyagi/A.I.-Quiz
    Description: GitHub owner/repository for the Next.js frontend.
  BackendRepository:
    Type: String
    Default: shoryatyagi/flask-backend
    Description: GitHub owner/repository for the Flask backend.
  FrontendBranch:
    Type: String
    Default: develop
  BackendBranch:
    Type: String
    Default: master
  MongoDbSecretArn:
    Type: String
    Description: Secrets Manager secret containing only the MongoDB connection URI as SecretString.
  GroqApiKeySecretArn:
    Type: String
    Description: Secrets Manager secret containing only the Groq API key as SecretString.
  FirebaseServiceAccountSecretArn:
    Type: String
    Description: Secrets Manager secret whose SecretString is the Firebase service-account JSON object.
  AppSecretKeySecretArn:
    Type: String
    Description: Secrets Manager secret containing the Flask SECRET_KEY value as SecretString.
  RedisAuthTokenSecretArn:
    Type: String
    Description: Secrets Manager secret containing a 32+ character hexadecimal Redis token.
  FrontendMaxTasks:
    Type: Number
    Default: 6
    MinValue: 2
    MaxValue: 50
  BackendMaxTasks:
    Type: Number
    Default: 10
    MinValue: 2
    MaxValue: 100
  RedisNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: ElastiCache node type. This architecture is not Free Tier-only.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  NoCertificate: !Equals [!Ref CertificateArn, '']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-vpc' }]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.0/24
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-a' }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-b' }]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.10.0/24
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-a' }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.11.0/24
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-b' }]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }
  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties: { Domain: vpc }
  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicAssociationA
    Properties:
      AllocationId: !GetAtt NatAddress.AllocationId
      SubnetId: !Ref PublicSubnetA
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and HTTP redirect for the QuizMaster ALB.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow frontend traffic only from the ALB.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 0.0.0.0/0 }
  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow backend traffic only from the ALB.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5000, ToPort: 5000, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 0.0.0.0/0 }
  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis accepts connections only from backend tasks.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref BackendSecurityGroup }
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 0.0.0.0/0 }
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Private subnets for QuizMaster Socket.IO coordination.
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: !Sub '${AWS::StackName} Socket.IO message queue'
      Engine: redis
      CacheNodeType: !Ref RedisNodeType
      NumCacheClusters: 2
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      AuthToken: !Sub '{{resolve:secretsmanager:${RedisAuthTokenSecretArn}:SecretString}}'
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds: [!Ref RedisSecurityGroup]

  FrontendRepositoryResource:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-frontend'
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'
  BackendRepositoryResource:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-backend'
      ImageScanningConfiguration: { ScanOnPush: true }
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-github-actions'
      Description: GitHub Actions deployment role restricted to this repository and branch.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${FrontendRepository}:ref:refs/heads/${FrontendBranch}'
                  - !Sub 'repo:${BackendRepository}:ref:refs/heads/${BackendBranch}'
      Policies:
        - PolicyName: PushImagesAndUpdateServices
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt FrontendRepositoryResource.Arn
                  - !GetAtt BackendRepositoryResource.Arn
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
              - Effect: Allow
                Action:
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:UpdateService
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${AWS::StackName}/*'
                  - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${AWS::StackName}'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt ApplicationTaskRole.Arn
                Condition:
                  StringEquals: { iam:PassedToService: ecs-tasks.amazonaws.com }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AWS::StackName
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 30
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: ReadApplicationSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref MongoDbSecretArn
                  - !Ref GroqApiKeySecretArn
                  - !Ref FirebaseServiceAccountSecretArn
                  - !Ref AppSecretKeySecretArn
                  - !Ref RedisAuthTokenSecretArn
  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /
      Matcher: { HttpCode: '200-399' }
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - { Key: stickiness.enabled, Value: 'true' }
        - { Key: stickiness.lb_cookie.duration_seconds, Value: '3600' }
  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 5000
      HealthCheckPath: /api/health
      Matcher: { HttpCode: '200-399' }
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - { Key: stickiness.enabled, Value: 'true' }
        - { Key: stickiness.lb_cookie.duration_seconds, Value: '3600' }
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '300' }
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref FrontendTargetGroup }]
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref FrontendTargetGroup }]
  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: NoCertificate
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 10
      Conditions: [{ Field: path-pattern, Values: ['/api/*'] }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref BackendTargetGroup }]
  SocketIoListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: NoCertificate
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 20
      Conditions: [{ Field: path-pattern, Values: ['/socket.io/*'] }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref BackendTargetGroup }]
  HttpRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 1
      Conditions: [{ Field: path-pattern, Values: ['/*'] }]
      Actions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
  HttpsApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions: [{ Field: path-pattern, Values: ['/api/*'] }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref BackendTargetGroup }]
  HttpsSocketIoListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: HasCertificate
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions: [{ Field: path-pattern, Values: ['/socket.io/*'] }]
      Actions: [{ Type: forward, TargetGroupArn: !Ref BackendTargetGroup }]

  FrontendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-frontend'
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: frontend
          Image: public.ecr.aws/docker/library/node:20-alpine
          Essential: true
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: '3000' }
            - { Name: HOSTNAME, Value: 0.0.0.0 }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend
  BackendTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-backend'
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: public.ecr.aws/docker/library/python:3.11-slim
          Essential: true
          PortMappings: [{ ContainerPort: 5000, Protocol: tcp }]
          Environment:
            - { Name: FLASK_DEBUG, Value: 'false' }
            - { Name: USE_EVENTLET, Value: 'true' }
            - { Name: MONGODB_DB_NAME, Value: quizapp }
            - Name: FRONTEND_URL
              Value: !If [HasCertificate, !Sub 'https://${DomainName}', !Sub 'http://${LoadBalancer.DNSName}']
            - Name: ALLOWED_ORIGINS
              Value: !If [HasCertificate, !Sub 'https://${DomainName}', !Sub 'http://${LoadBalancer.DNSName}']
            - { Name: SOCKETIO_REDIS_HOST, Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address }
          Secrets:
            - { Name: MONGODB_URI, ValueFrom: !Ref MongoDbSecretArn }
            - { Name: GROQ_API_KEY, ValueFrom: !Ref GroqApiKeySecretArn }
            - { Name: FIREBASE_CREDENTIALS_JSON, ValueFrom: !Ref FirebaseServiceAccountSecretArn }
            - { Name: SECRET_KEY, ValueFrom: !Ref AppSecretKeySecretArn }
            - { Name: SOCKETIO_REDIS_PASSWORD, ValueFrom: !Ref RedisAuthTokenSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-frontend'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref FrontendTaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - { ContainerName: frontend, ContainerPort: 3000, TargetGroupArn: !Ref FrontendTargetGroup }
  BackendService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: !Sub '${AWS::StackName}-backend'
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BackendTaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref BackendSecurityGroup]
      LoadBalancers:
        - { ContainerName: backend, ContainerPort: 5000, TargetGroupArn: !Ref BackendTargetGroup }

  FrontendScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: FrontendService
    Properties:
      MaxCapacity: !Ref FrontendMaxTasks
      MinCapacity: 2
      ResourceId: !Sub 'service/${Cluster}/${FrontendService.Name}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  FrontendCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-frontend-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref FrontendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 180
        ScaleOutCooldown: 60
  FrontendRequestScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-frontend-request-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref FrontendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1000
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ['/', [!GetAtt LoadBalancer.LoadBalancerFullName, !GetAtt FrontendTargetGroup.TargetGroupFullName]]
        ScaleInCooldown: 180
        ScaleOutCooldown: 60
  BackendScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: BackendService
    Properties:
      MaxCapacity: !Ref BackendMaxTasks
      MinCapacity: 2
      ResourceId: !Sub 'service/${Cluster}/${BackendService.Name}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  BackendCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-backend-cpu-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 180
        ScaleOutCooldown: 60
  BackendRequestScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${AWS::StackName}-backend-request-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 300
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ['/', [!GetAtt LoadBalancer.LoadBalancerFullName, !GetAtt BackendTargetGroup.TargetGroupFullName]]
        ScaleInCooldown: 180
        ScaleOutCooldown: 60

Outputs:
  AppUrl:
    Description: Public app URL; use as the frontend NEXT_PUBLIC_API_URL build value.
    Value: !If [HasCertificate, !Sub 'https://${DomainName}', !Sub 'http://${LoadBalancer.DNSName}']
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  LoadBalancerHostedZoneId:
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
  NatGatewayEip:
    Description: Allowlist this stable address in MongoDB Atlas network access if required.
    Value: !Ref NatAddress
  FrontendRepositoryUri:
    Value: !GetAtt FrontendRepositoryResource.RepositoryUri
  BackendRepositoryUri:
    Value: !GetAtt BackendRepositoryResource.RepositoryUri
  ClusterName:
    Value: !Ref Cluster
  FrontendServiceName:
    Value: !GetAtt FrontendService.Name
  BackendServiceName:
    Value: !GetAtt BackendService.Name
  RedisPrimaryEndpoint:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
  FrontendTaskFamily:
    Value: !Sub '${AWS::StackName}-frontend'
  BackendTaskFamily:
    Value: !Sub '${AWS::StackName}-backend'
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
